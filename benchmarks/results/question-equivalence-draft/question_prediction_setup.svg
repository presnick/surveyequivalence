  <g id="text_15">
   <text style="fill: #172a39; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="60.48" y="48.396563" transform="rotate(-0 60.48 48.396563)">How predictive is a question?</text>
  </g>
  <g id="text_16">
   <text style="fill: #536674; font: 11px 'DejaVu Sans'; text-anchor: start" x="60.48" y="73.446281" transform="rotate(-0 60.48 73.446281)">Working interpretation: questions supply signals; a later observed outcome is the target.</text>
  </g>
  <g id="text_17">
   <text style="fill: #536674; font: 700 9px 'DejaVu Sans'; text-anchor: end" x="803.52" y="15.552" transform="rotate(-0 803.52 15.552)">CONCEPTUAL DRAFT / PANEL DEFINITION PENDING</text>
  </g>
  <g id="text_18">
   <text style="fill: #172a39; font: 700 13px 'DejaVu Sans'; text-anchor: start" x="60.48" y="486.72" transform="rotate(-0 60.48 486.72)">Equivalence asks: what reference-panel size matches the question's predictive score?</text>
  </g>
  <g id="text_19">
   <text style="fill: #536674; font: 9px 'DejaVu Sans'" transform="translate(60.48 540.110672)">Provisional unit: one question. A market price aggregates traders; it is not one human rating.</text>
   <text style="fill: #536674; font: 9px 'DejaVu Sans'" transform="translate(60.48 552.240281)">Real data must define the outcome cases, forecast cutoff, question identities, and reference pool before scoring.</text>
  </g>
