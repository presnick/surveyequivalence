  <g id="text_22">
   <text style="fill: #172a39; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="60.48" y="48.396563" transform="rotate(-0 60.48 48.396563)">Compare predictive performance on the same cases</text>
  </g>
  <g id="text_23">
   <text style="fill: #536674; font: 11px 'DejaVu Sans'; text-anchor: start" x="60.48" y="73.446281" transform="rotate(-0 60.48 73.446281)">2,400 training cases / 1,600 held-out cases / a separately fitted predictor for every question subset</text>
  </g>
  <g id="text_24">
   <text style="fill: #536674; font: 700 9px 'DejaVu Sans'; text-anchor: end" x="803.52" y="15.552" transform="rotate(-0 803.52 15.552)">SIMULATED DATA / NOT PEW OR KALSHI RESULTS</text>
  </g>
  <g id="text_25">
   <text style="fill: #536674; font: 9px 'DejaVu Sans'" transform="translate(60.48 527.981063)">Dots: held-out scores. Lines: 95% paired test-case bootstrap intervals, conditional on fixed fitted models.</text>
   <text style="fill: #536674; font: 9px 'DejaVu Sans'" transform="translate(60.48 540.110672)">Zero questions uses the training outcome frequency. These synthetic differences describe the simulation only.</text>
   <text style="fill: #536674; font: 9px 'DejaVu Sans'" transform="translate(60.48 552.240281)">Panels use jointly fitted logistic predictors; no human-equivalence or information-equivalence claim is made.</text>
  </g>
