  <g id="text_19">
   <text style="fill: #586879; font: 11px 'DejaVu Sans'" transform="translate(65.52 87.414281)">Jayles experiment: participants actually saw 1, 3, 5, 7, 9 or 11 peers' estimates, or their geometric mean.</text>
   <text style="fill: #586879; font: 11px 'DejaVu Sans'" transform="translate(65.52 102.657273)">All results below use five recorded reports per panel. Positive values mean lower error after social information.</text>
  </g>
  <g id="text_20">
   <text style="fill: #586879; font: 9px 'DejaVu Sans'; text-anchor: end" x="947.52" y="14.256" transform="rotate(-0 947.52 14.256)">REAL STUDY RESPONSES  /  05</text>
  </g>
  <g id="text_21">
   <text style="fill: #586879; font: 8.5px 'DejaVu Sans'; text-anchor: start" x="65.52" y="631.152" transform="rotate(-0 65.52 631.152)">Jayles, Sire &amp; Kurvers (2021)  |  doi.org/10.1098/rsif.2021.0231  |  Data: figshare 12529571</text>
  </g>
  <g id="text_22">
   <text style="fill: #202c3b; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="105.84" y="522.936" transform="rotate(-0 105.84 522.936)">This horizontal axis is an experimental manipulation, not a resampled panel size.</text>
  </g>
  <g id="text_23">
   <text style="fill: #586879; font: 9.3px 'DejaVu Sans'" transform="translate(65.52 550.166088)">Lines join observed condition means; no response model is fitted. Shading: exploratory pointwise 95% whole-group bootstrap intervals.</text>
   <text style="fill: #586879; font: 9.3px 'DejaVu Sans'" transform="translate(65.52 563.76)">Each display has only 6 groups. Questions vary within group across tau; the 42-question coverage is balanced across groups.</text>
  </g>
  <g id="text_24">
   <text style="fill: #586879; font: 9.3px 'DejaVu Sans'; text-anchor: start" x="65.52" y="600.696" transform="rotate(-0 65.52 600.696)">These are paired before/after gains, not a formal causal comparison of display types or peer-count levels.</text>
  </g>
 </g>
 <defs>
  <clipPath id="pf0f678d640">
   <rect x="105.84" y="171.72" width="796.32" height="298.08"/>
  </clipPath>
 </defs>
